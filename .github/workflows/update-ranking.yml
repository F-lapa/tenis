name: Atualizar ranking ATP

on:
  workflow_dispatch:
  schedule:
    # Toda segunda-feira 08:00 UTC (após publicação ATP)
    - cron: "0 8 * * 1"

permissions:
  contents: write

jobs:
  atualizar-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Atualizar ranking (gratuito)
        run: npm run update-ranking

      - name: Salvar ranking no repositório
        run: |
          if [ ! -f data/ranking.json ]; then
            echo "::error::data/ranking.json não foi gerado"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ranking.json

          if git diff --cached --quiet; then
            echo "Sem alteração no ranking."
            exit 0
          fi

          git commit -m "Atualiza ranking ATP ($(date -u +%Y-%m-%d))"
          git push
          echo "Ranking publicado com sucesso."
